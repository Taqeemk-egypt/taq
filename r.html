<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>جاري التحويل... | تقييمك كود QR ديناميكي</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- App Custom Styles -->
  <link rel="stylesheet" href="style.css">

</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Glow effect -->
  <div class="fixed w-80 h-80 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <div class="glass-panel max-w-md w-full rounded-3xl p-8 text-center border border-slate-800 shadow-2xl space-y-6 relative z-10">
    
    <!-- Animated QR Loader Box -->
    <div id="loader-state" class="space-y-4">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-indigo-600 to-cyan-400 flex items-center justify-center text-white text-2xl shadow-lg shadow-indigo-500/30 animate-pulse">
        <i class="fa-solid fa-qrcode"></i>
      </div>

      <div class="space-y-1">
        <h2 class="text-lg font-black text-white">جاري التحويل إلى الرابط المستهدف...</h2>
        <p class="text-xs text-slate-400">بواسطة تقييمك للروابط وأكواد QR الديناميكية</p>
      </div>

      <div class="w-full bg-slate-800 rounded-full h-1.5 overflow-hidden">
        <div class="bg-gradient-to-r from-indigo-500 to-cyan-400 h-full w-2/3 animate-pulse"></div>
      </div>
      
      <p id="target-preview" class="text-[11px] font-mono text-cyan-400 truncate max-w-xs mx-auto"></p>
    </div>

    <!-- Error State (Hidden by default) -->
    <div id="error-state" class="hidden space-y-4">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-red-500/20 text-red-400 flex items-center justify-center text-2xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>

      <div class="space-y-1">
        <h2 class="text-lg font-black text-white">كود QR غير متوفر</h2>
        <p id="error-message" class="text-xs text-slate-400">هذا الكود غير موجود أو تم إيقافه بواسطة صاحبه.</p>
      </div>

      <div class="pt-3">
        <a href="index.html" class="btn-primary text-xs px-6 py-2.5">
          <i class="fa-solid fa-house ml-1"></i> الانتقال لمنصة تقييمك
        </a>
      </div>
    </div>

  </div>

  <!-- Supabase JS v2 & App Configuration & Logic Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('c') || urlParams.get('id');

      if (!slug) {
        showError('لم يتم تحديد كود QR للتحويل.');
        return;
      }

      try {
        const qr = await Taqeemk.API.getQRCodeBySlugOrId(slug);
        if (!qr) {
          showError('كود QR المطلوب غير مسجل في النظام.');
          return;
        }

        if (!qr.is_active) {
          showError('تم تعطيل هذا الكود مؤقتاً بواسطة صاحبه.');
          return;
        }

        let target = (qr.target_url || '').trim();
        if (!target) {
          showError('الرابط المستهدف غير محدد لهذا الكود.');
          return;
        }

        if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(target)) {
          target = 'https://' + target;
        }

        document.getElementById('target-preview').textContent = target;

        // Record scan analytics in background
        await Taqeemk.API.recordQRScan(qr.id);

        // Redirect seamlessly
        setTimeout(() => {
          window.location.replace(target);
        }, 700);

      } catch (err) {
        showError(err.message || 'حدث خطأ أثناء معالجة التوجيه.');
      }
    });

    function showError(msg) {
      document.getElementById('loader-state').classList.add('hidden');
      document.getElementById('error-message').textContent = msg;
      document.getElementById('error-state').classList.remove('hidden');
    }
  </script>

</body>
</html>
